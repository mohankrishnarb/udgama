<div class="signup-wrapper">
  <div class="card shadow-lg bg-white">
    <div class="text-center mb-4">
      <h2 class="fw-bold title-color">Create Account</h2>
      <p class="text-muted">Join the Udgama Business Suite</p>
    </div>

    <form #signupForm="ngForm" (ngSubmit)="signup()">

      <mat-form-field class="w-100 mb-2" appearance="outline">
        <mat-label>Full Name</mat-label>
        <mat-icon matIconPrefix>person</mat-icon>
        <input matInput name="fullname" [(ngModel)]="user.fullname" required>
      </mat-form-field>

      <mat-form-field class="w-100 mb-2" appearance="outline">
        <mat-label>Email Address</mat-label>
        <mat-icon matIconPrefix>mail</mat-icon>
        <input matInput name="email" [(ngModel)]="user.email" required>
      </mat-form-field>

      <mat-form-field class="w-100 mb-2" appearance="outline">
        <mat-label>Password</mat-label>
        <mat-icon matIconPrefix>lock</mat-icon>
        <input matInput name="password" type="password" [(ngModel)]="user.password" required>
      </mat-form-field>

      <mat-form-field class="w-100 mb-4" appearance="outline">
        <mat-label>Confirm Password</mat-label>
        <mat-icon matIconPrefix>lock_reset</mat-icon>
        <input matInput name="confirmPassword" type="password" [(ngModel)]="confirmPassword" required>
      </mat-form-field>

      <button mat-raised-button type="submit" class="w-100" [disabled]="!signupForm.valid || isLoading"
        style="background-color: #165a50; color: white;">
        @if (isLoading) {
        <mat-spinner diameter="24"></mat-spinner>
        } @else {
        <span>Sign Up</span>
        }
      </button>
    </form>


    <div class="text-center small">
      <span class="text-muted">Already have an account?</span>
      <a routerLink="/" class="ms-2 sign-in-link">Sign In</a>
    </div>
  </div>
</div>
