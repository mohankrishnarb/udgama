<div class="login-wrapper">
  <div class="card shadow-sm">
    <h2 class="text-center mb-4 fw-bold" style="color: #165a50">Login to Udgama</h2>
    
    <mat-form-field class="w-100" appearance="outline">
      <mat-label>Email</mat-label>
      <mat-icon matIconPrefix style="color: #165a50;">email</mat-icon>
      <input matInput placeholder="name@udgama.com">
    </mat-form-field>

    <mat-form-field class="w-100" appearance="outline">
      <mat-label>Password</mat-label>
      <mat-icon matIconPrefix style="color: #165a50;">lock</mat-icon>
      <input matInput type="password" placeholder="Enter password">
    </mat-form-field>

    <button mat-raised-button class="w-100 mb-3" (click)="login()">Sign In</button>

    <div class="text-center small">
      <a routerLink="/reset-password">Forgot Password?</a>
      <p class="mt-3 text-muted">
        Don't have an account? 
        <a routerLink="/signup" class="fw-bold">Sign Up</a>
      </p>
    </div>
  </div>
</div>
