<div class="kanbanForm text-center">
    <form>
        <div class="form-group">
            <mat-form-field appearance="outline">
                <mat-label>Project Title</mat-label>
                <input matInput placeholder="Project name">
                <mat-icon matSuffix>title</mat-icon>
            </mat-form-field>
        </div>
        <div class="form-group">
            <mat-form-field appearance="outline">
                <mat-label>Project Board</mat-label>
                <mat-select>
                    @for(item of status; track item){
                    <mat-option [value]="item.value">{{item.viewValue}}</mat-option>
                    }
                </mat-select>
                <mat-icon matSuffix>check_circle</mat-icon>
            </mat-form-field>
        </div>
        <div class="form-group">
            <mat-form-field appearance="outline">
                <mat-label>Add Members</mat-label>
                <mat-select [formControl]="members" multiple>
                    @for(item of memberList; track item){
                    <mat-option [value]="item">{{item}}</mat-option>
                    }
                </mat-select>
                <mat-icon matSuffix>person_add</mat-icon>
            </mat-form-field>
        </div>
        <div class="form-group">
            <mat-form-field appearance="outline">
                <mat-label>DeadLine</mat-label>
                <input matInput [matDatepicker]="deadline" placeholder="DD/MM/YYYY">
                <mat-datepicker-toggle matIconSuffix [for]="deadline"></mat-datepicker-toggle>
                <mat-datepicker #deadline></mat-datepicker>
            </mat-form-field>
        </div>
        <div class="form-group">
            <mat-form-field appearance="outline">
                <mat-label>Priority</mat-label>
                <mat-select [formControl]="priorities">
                    @for(item of priorityList; track item){
                    <mat-option [value]="item">{{item}}</mat-option>
                    }
                </mat-select>
                <mat-icon matSuffix>label</mat-icon>
            </mat-form-field>
        </div>
        <div class="form-group">
            <mat-form-field appearance="outline">
                <mat-label>Project Description</mat-label>
                <textarea matInput placeholder="Project Summary"></textarea>
                <mat-icon matSuffix>assignment</mat-icon>
            </mat-form-field>
        </div>
    </form>
</div>
