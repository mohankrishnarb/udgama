<section class="user-wrapper">
    <div class="container-fluid">
        <div class="container">
            <div class="row">
                <div class="userbg bg-white rounded p-4">
                    <div class="userbg p-4">
                        <div class="flex justify-end items-center mb-4">
                            <div class="header">
                                <h2 class="text-2xl font-semibold">User Management</h2>
                                <button mat-flat-button class="mt-2 adBtn">
                                    <mat-icon>add</mat-icon> Add User
                                </button>
                            </div>
                        </div>

                        <mat-form-field appearance="outline" class="search-field">
                            <mat-label>Search users</mat-label>
                            <input matInput (keyup)="applyFilter($event)" placeholder="Ex. John Doe" #input>
                            <mat-icon matSuffix>search</mat-icon>
                        </mat-form-field>

                        <div class="mat-elevation-z2 rounded-lg overflow-hidden">
                            <table mat-table [dataSource]="dataSource" matSort>

                                <ng-container matColumnDef="_id">
                                    <th mat-header-cell *matHeaderCellDef mat-sort-header> ID </th>
                                    <td mat-cell *matCellDef="let row"> {{row._id}} </td>
                                </ng-container>

                                <ng-container matColumnDef="name">
                                    <th mat-header-cell *matHeaderCellDef mat-sort-header> Name </th>
                                    <td mat-cell *matCellDef="let row"> {{row.fullname}} </td>
                                </ng-container>

                                <ng-container matColumnDef="email">
                                    <th mat-header-cell *matHeaderCellDef mat-sort-header> Email </th>
                                    <td mat-cell *matCellDef="let row"> {{row.email}} </td>
                                </ng-container>

                                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                                <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

                                <tr class="mat-row" *matNoDataRow>
                                    <td class="mat-cell p-4" colspan="4">No data matching the filter "{{input.value}}"
                                    </td>
                                </tr>
                            </table>

                            <mat-paginator [pageSizeOptions]="[5, 10, 25]"
                                aria-label="Select page of users"></mat-paginator>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>
</section>
