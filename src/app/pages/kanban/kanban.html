<section class="kanbanWrapper">
    <div class="container-fluid">
        <div class="row">
            <div class="kanbanHeader bg-white p-3 mb-3 rounded">
                <div class="kanbanTitle">
                    <p class="fs-6 text-capitalize title">kanban board</p>
                </div>
                <div class="addNewKanban rounded py-2 my-1">
                    <button type="button" class="addKanban btn btn-sm btn-success text-capitalize mt-1" data-bs-toggle="modal" data-bs-target="#addKanbanModal">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor"
                            class="bi bi-plus" viewBox="0 0 16 16">
                            <path
                                d="M8 4a.5.5 0 0 1 .5.5v3h3a.5.5 0 0 1 0 1h-3v3a.5.5 0 0 1-1 0v-3h-3a.5.5 0 0 1 0-1h3v-3A.5.5 0 0 1 8 4" />
                        </svg> create task</button>
                    <span class="kanbanInput"><input type="text" class="form-control" placeholder="Search ..."></span>
                </div>
            </div>
            <div class="kanabnContent bg-white p-3 rounded">
              <app-kanban-board></app-kanban-board>
            </div>
        </div>
    </div>
</section>

<!-- add kanban model -->

<div class="modal fade" id="addKanbanModal" tabindex="-1" aria-labelledby="addKanbanModalLabel" >
  <div class="modal-dialog modal-dialog-centered modal-md">
    <div class="modal-content">
      <div class="modal-header bg-success bg-gradient">
        <p class="modal-title fs-5 text-capitalize text-white" id="addKanbanModalLabel">add new task</p>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <app-add-kanban></app-add-kanban>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        <button type="button" class="btn btn-success bg-gradient text-capitalize">create task</button>
      </div>
    </div>
  </div>
</div>
